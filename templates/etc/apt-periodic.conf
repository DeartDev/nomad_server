// ===========================================================================
//  nomad_server — activación de las tareas periódicas de APT
//  Destino  : /etc/apt/apt.conf.d/20auto-upgrades
//  Generado por scripts/07_hardening.sh
//  Capítulo : docs/07_endurecimiento_del_sistema.md § 3.1
//
//  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
//
//      cd ~/nomad_server
//      source scripts/lib/entorno.sh
//      nomad_diff etc/apt-periodic.conf /etc/apt/apt.conf.d/20auto-upgrades
//      sudo mkdir -p /var/backups/nomad/config$(dirname /etc/apt/apt.conf.d/20auto-upgrades)
//      sudo cp -a /etc/apt/apt.conf.d/20auto-upgrades \
//          /var/backups/nomad/config/etc/apt/apt.conf.d/20auto-upgrades.bak-$(date +%Y%m%d-%H%M%S)
//      nomad_plantilla etc/apt-periodic.conf \
//          | sudo tee /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
//      sudo chmod 644 /etc/apt/apt.conf.d/20auto-upgrades
//
//  Y después, para que tenga efecto:
//      systemctl list-timers apt-daily-upgrade.timer --no-pager
//
//  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
// ===========================================================================

// Actualizar la lista de paquetes todos los días.
APT::Periodic::Update-Package-Lists "1";

// Descargar los paquetes actualizables todos los días. Descargar y instalar
// por separado hace que la ventana de instalación sea corta y previsible.
APT::Periodic::Download-Upgradeable-Packages "1";

// Instalar las actualizaciones desatendidas todos los días.
APT::Periodic::Unattended-Upgrade "1";

// Limpiar la caché de paquetes descargados cada semana, para que /var no
// crezca sin control.
APT::Periodic::AutocleanInterval "7";
