// ===========================================================================
//  nomad_server — activación de las tareas periódicas de APT
//  Destino  : /etc/apt/apt.conf.d/20auto-upgrades
//  Generado por scripts/07_hardening.sh
//  Capítulo : docs/07_endurecimiento_del_sistema.md § 3.1
// ===========================================================================

// Actualizar la lista de paquetes todos los días.
APT::Periodic::Update-Package-Lists "1";

// Descargar los paquetes actualizables todos los días. Descargar y instalar
// por separado hace que la ventana de instalación sea corta y previsible.
APT::Periodic::Download-Upgradeable-Packages "1";

// Instalar las actualizaciones desatendidas todos los días.
APT::Periodic::Unattended-Upgrade "1";

// Limpiar la caché de paquetes descargados cada semana, para que /var no
// crezca sin control.
APT::Periodic::AutocleanInterval "7";
