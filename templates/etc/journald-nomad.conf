# ===========================================================================
#  nomad_server — límites del registro del sistema
#  Destino  : /etc/systemd/journald.conf.d/50-nomad.conf
#  Generado por scripts/07_hardening.sh
#  Capítulo : docs/07_endurecimiento_del_sistema.md § 3.2
# ===========================================================================

[Journal]
# Registro persistente entre reinicios. Sin esto, tras un reinicio inesperado
# se pierde justo el registro que explicaría por qué ocurrió.
Storage=persistent

# Techo de espacio. Por omisión journald usa hasta el 10 % de /var, que en este
# servidor son varios gigabytes de registros que nadie va a leer.
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M

# Antigüedad máxima: un mes es suficiente para investigar un incidente.
MaxRetentionSec=1month

# Rotar los archivos cada semana para que las consultas por fecha sean rápidas.
MaxFileSec=1week

# Limitar las ráfagas: un servicio en bucle de error puede escribir cientos de
# miles de líneas por minuto y llenar el disco.
RateLimitIntervalSec=30s
RateLimitBurst=10000

# Reenviar al syslog clásico no aporta nada si no hay rsyslog instalado.
ForwardToSyslog=no
