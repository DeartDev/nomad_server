// ===========================================================================
//  nomad_server — actualizaciones automáticas
//  Destino  : /etc/apt/apt.conf.d/52-nomad-unattended
//  Generado por scripts/07_hardening.sh
//  Capítulo : docs/07_endurecimiento_del_sistema.md § 3.1
//
//  Este archivo se carga DESPUÉS de 50unattended-upgrades (52 > 50), así que
//  sus valores tienen prioridad sin necesidad de editar el original, que una
//  actualización del paquete podría sobrescribir.
// ===========================================================================

// Qué se actualiza: solo seguridad y las correcciones puntuales de la versión
// estable. NO se actualizan paquetes de otros orígenes ni se salta de versión.
Unattended-Upgrade::Origins-Pattern {
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
    "origin=Debian,codename=${distro_codename}-updates";
};

// Paquetes que nunca se actualizan solos. Vacío a propósito: en el host no hay
// ningún servicio cuya actualización pueda romper nada. Todo lo delicado vive
// en contenedores, con sus propias versiones fijadas.
Unattended-Upgrade::Package-Blacklist {
};

// Eliminar kernels antiguos automáticamente. Sin esto, /boot acaba llenándose
// y la siguiente actualización del kernel falla.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";

// Reinicio automático cuando una actualización lo requiera (kernel, libc).
// Un parche de kernel instalado pero sin reiniciar no protege de nada.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
// No reiniciar si hay alguien conectado: si estás trabajando, decides tú.
Unattended-Upgrade::Automatic-Reboot-WithUsers "false";

// Descargar antes de la ventana de instalación, para que el proceso sea corto.
Unattended-Upgrade::MinimalSteps "true";

// Registro detallado en /var/log/unattended-upgrades/
Unattended-Upgrade::SyslogEnable "true";
Unattended-Upgrade::SyslogFacility "daemon";

// Correo de aviso. Requiere un agente de correo configurado; si no lo hay,
// esta línea no hace nada. El aviso real llega por Uptime Kuma (capítulo 13).
//Unattended-Upgrade::Mail "tu@correo";
//Unattended-Upgrade::MailReport "on-change";
