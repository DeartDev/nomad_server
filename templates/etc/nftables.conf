#!/usr/sbin/nft -f
# ===========================================================================
#  nomad_server — cortafuegos
#  Destino  : /etc/nftables.conf
#  Generado por scripts/06_firewall.sh
#  Capítulo : docs/06_red_y_firewall.md
#
#  No lo edites aquí: edita config/servidor.env y vuelve a ejecutar el script.
# ===========================================================================
#
#  DOS DECISIONES QUE HAY QUE ENTENDER ANTES DE TOCAR ESTE ARCHIVO
#
#  1. NO se usa 'flush ruleset'.
#     La plantilla que trae Debian empieza con 'flush ruleset', que borra TODAS
#     las reglas del sistema. Eso incluye las que Docker crea al arrancar: si
#     se recarga el cortafuegos con contenedores en marcha, se quedan sin red
#     hasta reiniciar Docker.
#     En su lugar se declara y se borra únicamente nuestra tabla. El resto del
#     conjunto de reglas —el de Docker— queda intacto.
#
#  2. NO se define una cadena 'forward'.
#     El reenvío entre contenedores y hacia internet lo gestiona Docker con sus
#     propias cadenas. Si aquí se declarara una cadena forward con política
#     drop, netfilter evaluaría AMBAS y bastaría con que una descartara el
#     paquete: los contenedores se quedarían sin red, con un diagnóstico
#     confuso.
#     La exposición se controla en el diseño, no aquí: ningún contenedor
#     publica puertos en el host (capítulo 09).
#
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      nomad_diff etc/nftables.conf /etc/nftables.conf
#      sudo mkdir -p /var/backups/nomad/config$(dirname /etc/nftables.conf)
#      sudo cp -a /etc/nftables.conf \
#          /var/backups/nomad/config/etc/nftables.conf.bak-$(date +%Y%m%d-%H%M%S)
#      nomad_plantilla etc/nftables.conf \
#          | sudo tee /etc/nftables.conf >/dev/null
#      sudo chmod 640 /etc/nftables.conf
#
#  Y después, para que tenga efecto:
#      sudo nft -c -f /etc/nftables.conf && sudo systemctl reload nftables
#
#  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
# ===========================================================================

# Crear la tabla si no existe y borrarla a continuación. Este par de líneas
# hace el archivo idempotente sin tocar las reglas de nadie más.
table inet nomad_filter
delete table inet nomad_filter

define lan_cidr  = ${LAN_CIDR}
define ts_cidr   = ${TS_CIDR}
define ssh_port  = ${SSH_PUERTO}
define ts_iface  = "${TS_INTERFAZ}"

table inet nomad_filter {

    chain entrada {
        type filter hook input priority filter; policy drop;

        # Respuestas al tráfico que hemos iniciado nosotros.
        ct state established,related accept

        # Paquetes que no encajan en ninguna conexión conocida.
        ct state invalid drop

        # Tráfico interno de la propia máquina.
        iif lo accept

        # ICMP: diagnóstico y descubrimiento de MTU. Bloquearlo entero rompe
        # conexiones de forma sutil y difícil de depurar.
        ip protocol icmp icmp type { \
            echo-request, echo-reply, destination-unreachable, \
            time-exceeded, parameter-problem } accept
        ip6 nexthdr ipv6-icmp accept

        # Administración por SSH desde la red local.
        ip saddr $lan_cidr tcp dport $ssh_port accept \
            comment "SSH desde la LAN"

        # Todo lo que llega por la VPN. La autenticación y el cifrado los
        # garantiza WireGuard antes de que el paquete aparezca aquí.
        iifname $ts_iface accept \
            comment "Tailscale (interfaz)"
        ip saddr $ts_cidr accept \
            comment "Tailscale (rango CGNAT)"

        # Puerto de escucha de Tailscale para conexiones directas. Sin esta
        # regla la VPN sigue funcionando, pero cae al relé DERP y añade
        # latencia.
        udp dport 41641 accept \
            comment "Tailscale: conexiones directas"

        # Registro de lo descartado, con límite para no llenar el disco.
        # Se consulta con: journalctl -k | grep nomad-descartado
        limit rate 5/minute burst 10 packets \
            log prefix "nomad-descartado: " level info
    }

    chain salida {
        type filter hook output priority filter; policy accept;
        # El servidor puede iniciar cualquier conexión: la necesita para
        # actualizarse, para los túneles salientes de Tailscale y Cloudflare,
        # y para descargar imágenes de contenedor.
    }
}
