# ===========================================================================
#  nomad_server — endurecimiento de OpenSSH
#  Destino  : /etc/ssh/sshd_config.d/50-nomad.conf
#  Generado por scripts/05_ssh.sh
#  Capítulo : docs/05_usuarios_y_acceso_ssh.md
#
#  No lo edites aquí: edita config/servidor.env y vuelve a ejecutar el script.
#
#  IMPORTANTE: en OpenSSH gana la PRIMERA aparición de cada directiva. Como
#  /etc/ssh/sshd_config incluye este directorio al principio, lo de aquí tiene
#  prioridad sobre el resto del archivo.
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      nomad_diff etc/sshd_50-nomad.conf /etc/ssh/sshd_config.d/50-nomad.conf
#      sudo mkdir -p /var/backups/nomad/config$(dirname /etc/ssh/sshd_config.d/50-nomad.conf)
#      sudo cp -a /etc/ssh/sshd_config.d/50-nomad.conf \
#          /var/backups/nomad/config/etc/ssh/sshd_config.d/50-nomad.conf.bak-$(date +%Y%m%d-%H%M%S)
#      nomad_plantilla etc/sshd_50-nomad.conf \
#          | sudo tee /etc/ssh/sshd_config.d/50-nomad.conf >/dev/null
#      sudo chmod 644 /etc/ssh/sshd_config.d/50-nomad.conf
#
#  Y después, para que tenga efecto:
#      sudo sshd -t && sudo systemctl restart ssh
#
#  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
# ===========================================================================

Port ${SSH_PUERTO}

# --- Autenticación: solo llaves -------------------------------------------
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM yes

# --- Quién puede entrar ----------------------------------------------------
PermitRootLogin no
# AllowUsers no es acumulativa: gana la primera aparición de la directiva y la
# lista de esa línea es la única que cuenta. Por eso los usuarios adicionales
# se añaden aquí mismo, con SSH_USUARIOS_EXTRA, y no en otro archivo del
# directorio. Vacía la variable, queda solo el administrador.
AllowUsers ${ADMIN_USUARIO} ${SSH_USUARIOS_EXTRA}
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30

# --- Funciones que este servidor no usa ------------------------------------
X11Forwarding no
# Impide que quien controle el servidor use tus llaves para saltar a otros
# equipos. Desde aquí no se salta a ningún sitio.
AllowAgentForwarding no
PermitTunnel no
PrintMotd no

# AllowTcpForwarding se deja en su valor por omisión (yes) A PROPÓSITO:
# es lo que permite 'ssh -L' para llegar al panel de Traefik y a las
# herramientas de observabilidad (capítulos 10 y 13).

# --- Sesiones colgadas -----------------------------------------------------
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Registro --------------------------------------------------------------
# VERBOSE registra las huellas de las llaves usadas y da a fail2ban material
# suficiente para detectar los intentos fallidos.
LogLevel VERBOSE

# No se usa ListenAddress a propósito (capítulo 05 § 3.4): sshd escucha en
# todas las interfaces y es nftables quien decide desde dónde se puede llegar.
# Atarlo a tailscale0 haría que el servicio fallara al arrancar, porque esa
# interfaz se crea tarde en el arranque.
