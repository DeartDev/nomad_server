# ===========================================================================
#  nomad_server — parámetros del kernel
#  Destino  : /etc/sysctl.d/60-nomad-endurecimiento.conf
#  Generado por scripts/07_hardening.sh
#  Capítulo : docs/07_endurecimiento_del_sistema.md § 3.3
#
#  ⚠ LO QUE NO ESTÁ AQUÍ ES TAN IMPORTANTE COMO LO QUE ESTÁ
#
#  net.ipv4.ip_forward NO se pone a 0.
#  Casi todas las guías de endurecimiento lo desactivan «porque esto no es un
#  router». Docker SÍ necesita reenvío de paquetes: sin él, ningún contenedor
#  tiene red. El síntoma es desconcertante —los contenedores arrancan, pero no
#  resuelven ni salen a internet— y no apunta al cortafuegos ni al kernel.
#  Docker lo activa por su cuenta al arrancar; aquí simplemente no se estorba.
#
#  Tampoco se tocan los parámetros net.bridge.*, que Docker gestiona.
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      nomad_diff etc/sysctl-nomad.conf /etc/sysctl.d/60-nomad-endurecimiento.conf
#      sudo mkdir -p /var/backups/nomad/config$(dirname /etc/sysctl.d/60-nomad-endurecimiento.conf)
#      sudo cp -a /etc/sysctl.d/60-nomad-endurecimiento.conf \
#          /var/backups/nomad/config/etc/sysctl.d/60-nomad-endurecimiento.conf.bak-$(date +%Y%m%d-%H%M%S)
#      nomad_plantilla etc/sysctl-nomad.conf \
#          | sudo tee /etc/sysctl.d/60-nomad-endurecimiento.conf >/dev/null
#      sudo chmod 644 /etc/sysctl.d/60-nomad-endurecimiento.conf
#
#  Y después, para que tenga efecto:
#      sudo sysctl --system
#
#  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
# ===========================================================================

# --- Protección contra suplantación y encaminamiento manipulado ------------

# Descartar paquetes cuya dirección de origen no sería alcanzable por la
# interfaz por la que llegan (filtrado de ruta inversa).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# No aceptar paquetes con la ruta especificada por el emisor: permitirían
# eludir el encaminamiento normal.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# No aceptar redirecciones ICMP: podrían alterar la tabla de rutas.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Este equipo no es un router de la red local: no envía redirecciones.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# --- Resistencia a inundación de conexiones --------------------------------

net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 3

# No responder a pings dirigidos a la dirección de difusión (ataques smurf).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignorar respuestas ICMP con formato incorrecto.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# --- Registro --------------------------------------------------------------

# Anotar en el journal los paquetes con direcciones de origen imposibles.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# --- Superficie del kernel -------------------------------------------------

# Ocultar las direcciones de memoria del kernel a los procesos sin privilegios:
# son la base de muchos exploits de escalada.
kernel.kptr_restrict = 2

# Solo root puede leer el búfer del kernel (dmesg).
kernel.dmesg_restrict = 1

# Limitar el uso de ptrace a procesos padre: impide que un proceso
# comprometido inspeccione la memoria de otros del mismo usuario.
kernel.yama.ptrace_scope = 1

# No generar volcados de memoria de programas con setuid: pueden contener
# credenciales.
fs.suid_dumpable = 0

# --- Enlaces y tuberías ----------------------------------------------------
# Evitan una familia clásica de ataques en directorios compartidos como /tmp.
# En Debian ya vienen activados; se declaran para dejarlo explícito.

fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Memoria ---------------------------------------------------------------

# Con SSD y suficiente RAM, tender a no usar swap salvo necesidad real.
vm.swappiness = 10

# Número de mapas de memoria: algunos contenedores (bases de datos,
# buscadores) fallan al arrancar con el valor por omisión.
vm.max_map_count = 262144
