# ===========================================================================
#  nomad_server — instalación automatizada de Debian 13 (preseed)
# ===========================================================================
#  Capítulo : docs/03_instalacion_debian.md § 6
#
#  Reproduce exactamente las decisiones del capítulo 03: LVM con /, /var y /srv
#  separados, sin entorno gráfico, root bloqueada y el usuario administrador en
#  el grupo sudo.
#
#  CÓMO GENERAR TU VERSIÓN (las ${VARIABLES} se sustituyen por tus valores):
#
#      set -a; . config/servidor.env; set +a
#      envsubst "$(grep -oE '^[A-Z][A-Z0-9_]*=' config/servidor.env.example \
#                  | tr -d '=' | sed 's/^/${/; s/$/}/' | tr '\n' ' ')" \
#          < templates/preseed.cfg > /tmp/preseed.cfg
#
#  Hay que indicar a envsubst la lista exacta de variables: de lo contrario
#  destrozaría la sintaxis de partman, que también usa '$' ($primary, $lvmok).
#
#  CÓMO USARLO: sirve /tmp/preseed.cfg por HTTP desde tu equipo
#
#      python3 -m http.server 8000 --directory /tmp
#
#  y en el menú del instalador pulsa Tab sobre «Install» y añade al final:
#
#      auto=true priority=critical url=http://<ip-de-tu-equipo>:8000/preseed.cfg
#
#  ⚠ ADVERTENCIA
#  Un preseed no pregunta nada: borra ${DISCO_DESTINO} sin pedir confirmación.
#  Pruébalo SIEMPRE antes en una máquina virtual. La instalación manual descrita
#  en docs/03_instalacion_debian.md § 5 es la ruta recomendada y probada; este
#  archivo es útil cuando ya la has hecho al menos una vez y quieres repetirla
#  de forma idéntica.
#
#  Formato completo: https://www.debian.org/releases/trixie/amd64/apb
# ===========================================================================


# ---------------------------------------------------------------------------
# 1. Idioma, teclado y localización
# ---------------------------------------------------------------------------
# El sistema va en inglés a propósito: los mensajes de error en inglés se
# pueden buscar; los traducidos, casi nunca. Ver capítulo 03 § 5 paso 2.
d-i debian-installer/locale string ${SERVIDOR_LOCALE}
d-i localechooser/supported-locales multiselect ${SERVIDOR_LOCALE}

# Distribución FÍSICA de tu teclado. Cámbiala si no es la latinoamericana:
# es (España), us (EE. UU.), latam (Latinoamérica).
d-i keyboard-configuration/xkb-keymap select latam


# ---------------------------------------------------------------------------
# 2. Red
# ---------------------------------------------------------------------------
# DHCP durante la instalación; la IP estática se fija en el capítulo 06.
# Como ${LAN_IP} está reservada en el router para la MAC del servidor, el DHCP
# entrega justamente esa dirección.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ${SERVIDOR_HOSTNAME}
d-i netcfg/get_domain string ${SERVIDOR_DOMINIO_LOCAL}
d-i netcfg/hostname string ${SERVIDOR_HOSTNAME}

# No detener la instalación si el DHCP tarda o si no hay red inalámbrica.
d-i netcfg/dhcp_timeout string 60
d-i netcfg/wireless_wep string


# ---------------------------------------------------------------------------
# 3. Réplica de paquetes
# ---------------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string ${DEBIAN_MIRROR}
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string ${DEBIAN_SUITE}


# ---------------------------------------------------------------------------
# 4. Cuentas de usuario
# ---------------------------------------------------------------------------
# Root sin contraseña => cuenta bloqueada y el primer usuario va a 'sudo'.
# Es la decisión 3.1 del capítulo 03.
d-i passwd/root-login boolean false

d-i passwd/user-fullname string ${ADMIN_USUARIO}
d-i passwd/username string ${ADMIN_USUARIO}

# La contraseña se pregunta durante la instalación: NO la escribas aquí.
# Un preseed viaja por HTTP en claro y acaba en el histórico de comandos.
# Si necesitas desatender también esto (solo para pruebas en una VM), usa un
# hash generado con:  mkpasswd -m sha-512
#d-i passwd/user-password-crypted password $6$...
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false


# ---------------------------------------------------------------------------
# 5. Reloj
# ---------------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string ${SERVIDOR_ZONA_HORARIA}
d-i clock-setup/ntp boolean true


# ---------------------------------------------------------------------------
# 6. Particionado
# ---------------------------------------------------------------------------
# ⚠ ESTO BORRA EL DISCO INDICADO POR COMPLETO.
d-i partman-auto/disk string ${DISCO_DESTINO}
d-i partman-auto/method string lvm
d-i partman-auto-lvm/new_vg_name string vg0

# Eliminar cualquier LVM o RAID previo sin preguntar.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Receta: ESP + /boot fuera de LVM + volúmenes lógicos con tamaño fijo.
# Formato de cada entrada:  mínimo prioridad máximo sistema-de-archivos
# Al fijar mínimo = máximo en los volúmenes lógicos, el resto del grupo de
# volúmenes queda SIN ASIGNAR a propósito (capítulo 03 § 3.2): ampliar es
# trivial con lvextend, reducir es arriesgado.
#
# Tamaños en MB. Ajusta 'srv' según el tamaño de tu disco.
d-i partman-auto/expert_recipe string                                   \
    nomad ::                                                            \
        538 538 1075 free                                               \
            $iflabel{ gpt }                                             \
            $reusemethod{ }                                             \
            method{ efi } format{ }                                     \
        .                                                               \
        1024 1024 1024 ext4                                             \
            $primary{ } $bootable{ }                                    \
            method{ format } format{ }                                  \
            use_filesystem{ } filesystem{ ext4 }                        \
            mountpoint{ /boot }                                         \
        .                                                               \
        4096 10000 -1 ext4                                              \
            $defaultignore{ } $primary{ }                               \
            method{ lvm } vg_name{ vg0 }                                \
        .                                                               \
        40960 40960 40960 ext4                                          \
            $lvmok{ } lv_name{ raiz }                                   \
            method{ format } format{ }                                  \
            use_filesystem{ } filesystem{ ext4 }                        \
            mountpoint{ / }                                             \
        .                                                               \
        30720 30720 30720 ext4                                          \
            $lvmok{ } lv_name{ var }                                    \
            method{ format } format{ }                                  \
            use_filesystem{ } filesystem{ ext4 }                        \
            mountpoint{ /var }                                          \
        .                                                               \
        102400 102400 102400 ext4                                       \
            $lvmok{ } lv_name{ srv }                                    \
            method{ format } format{ }                                  \
            use_filesystem{ } filesystem{ ext4 }                        \
            mountpoint{ /srv }                                          \
        .                                                               \
        4096 4096 4096 linux-swap                                       \
            $lvmok{ } lv_name{ swap }                                   \
            method{ swap } format{ }                                    \
        .

d-i partman-auto/choose_recipe select nomad
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false


# ---------------------------------------------------------------------------
# 7. Selección de programas
# ---------------------------------------------------------------------------
# Solo servidor SSH y utilidades estándar. Nada de escritorio ni de servidor
# web: todo servicio va en contenedores (capítulo 03 § 3.7).
tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string sudo curl ca-certificates gnupg
d-i pkgsel/upgrade select full-upgrade

# Sin encuesta de popularidad: menos tráfico saliente que auditar.
popularity-contest popularity-contest/participate boolean false

# Las actualizaciones automáticas se configuran en el capítulo 07,
# con control sobre cuándo se reinicia.
d-i pkgsel/update-policy select none


# ---------------------------------------------------------------------------
# 8. Gestor de arranque
# ---------------------------------------------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string ${DISCO_DESTINO}


# ---------------------------------------------------------------------------
# 9. Fin
# ---------------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

# Retira el USB durante el reinicio, o volverá a arrancar el instalador.
