# ===========================================================================
#  nomad_server — configuración del túnel de Cloudflare
#  Destino  : ${CF_CONFIG_DIR}/config.yml
#  Generado por scripts/11_cloudflared.sh
#  Capítulo : docs/11_cloudflared_y_dominio.md
#
#  Fíjate en lo corto que es: hay UNA sola regla de entrada. Todo el tráfico
#  del túnel se entrega a Traefik, que decide a qué contenedor va según el
#  nombre de host. Añadir un proyecto nuevo NO toca este archivo (§ 3.3).
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      nomad_plantilla compose/cloudflared/config.yml \
#          > ${CF_CONFIG_DIR}/config.yml
#
#  A diferencia de las plantillas de /etc, estos archivos pertenecen a tu
#  usuario: NO se instalan con sudo. Si los escribes como root, después no
#  podrás editarlos ni levantar el proyecto sin sudo.
#
#  Y después, para que tenga efecto:
#      cd ${CF_CONFIG_DIR} && docker compose restart cloudflared
#
#  Comprueba antes de levantar nada que no ha quedado ninguna variable sin
#  sustituir. El patrón descarta los comentarios: si no, esta misma línea
#  saldría como coincidencia.
#      grep -n '^[^#]*\${' ${CF_CONFIG_DIR}/config.yml && echo REVISAR || echo CORRECTO
#
#  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
# ===========================================================================

tunnel: ${CF_TUNEL_ID}
credentials-file: /etc/cloudflared/${CF_TUNEL_ID}.json

# Métricas internas del túnel. Se usan para la comprobación de salud del
# contenedor y para el diagnóstico. No salen del contenedor.
metrics: 0.0.0.0:2000

# Las actualizaciones las gestiona la etiqueta de imagen del compose, no el
# propio binario: así la versión que corre es la que dice el fichero compose.
no-autoupdate: true

# Cuántas conexiones simultáneas mantiene con el borde de Cloudflare.
# Cuatro es el valor por omisión y va sobrado para un servidor doméstico.
protocol: quic

originRequest:
  connectTimeout: 30s
  # El origen es Traefik, dentro de la red de contenedores: HTTP en claro y
  # sin certificados que verificar (capítulo 10 § 3.5).
  noTLSVerify: false
  # No se define httpHostHeader a propósito: sin esa opción, cloudflared
  # conserva el nombre de host original, que es justo lo que Traefik necesita
  # para decidir el destino.

ingress:
  # Regla única: todo va a Traefik.
  - service: http://traefik:80

  # 'ingress' exige una regla final sin condición. La anterior ya lo es, así
  # que esta línea no llega a usarse nunca; se deja documentado el motivo.
  # Si algún host llega sin router en Traefik, Traefik responde 404.
