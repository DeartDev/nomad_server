# ===========================================================================
#  nomad_server — Traefik y su intermediario del socket
#  Destino  : ${DATOS_RAIZ}/traefik/docker-compose.yml
#  Generado por scripts/10_traefik.sh
#  Capítulo : docs/10_traefik.md
#
#  Fíjate en lo que NO hay: el servicio 'traefik' no publica el puerto 80 en
#  el host. Solo lo alcanza cloudflared desde dentro de la red 'proxy'.
#  El único puerto publicado es el interno, atado a una dirección privada.
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      nomad_plantilla compose/traefik/docker-compose.yml \
#          > ${DATOS_RAIZ}/traefik/docker-compose.yml
#
#  A diferencia de las plantillas de /etc, estos archivos pertenecen a tu
#  usuario: NO se instalan con sudo. Si los escribes como root, después no
#  podrás editarlos ni levantar el proyecto sin sudo.
#
#  Y después, para que tenga efecto:
#      cd ${DATOS_RAIZ}/traefik && docker compose config && docker compose up -d
#
#  Comprueba antes de levantar nada que no ha quedado ninguna variable sin
#  sustituir. El patrón descarta los comentarios: si no, esta misma línea
#  saldría como coincidencia.
#      grep -n '^[^#]*\${' ${DATOS_RAIZ}/traefik/docker-compose.yml && echo REVISAR || echo CORRECTO
#
#  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
# ===========================================================================

services:

  # -----------------------------------------------------------------------
  #  Intermediario del socket de Docker
  # -----------------------------------------------------------------------
  #  Traefik necesita consultar la lista de contenedores. Montarle el socket
  #  directamente le daría la API completa de Docker, con la que se puede
  #  arrancar un contenedor privilegiado y tomar el host entero.
  #
  #  Montar el socket con ':ro' NO lo impide: ':ro' impide escribir en el
  #  archivo, no impide hacer peticiones de escritura a la API. Es un error
  #  muy extendido (capítulo 10 § 3.2).
  #
  #  Este intermediario expone únicamente los puntos de la API que Traefik
  #  necesita, todos de lectura.
  # -----------------------------------------------------------------------
  socket-proxy:
    # Versión fijada a propósito: en la infraestructura no se usa 'latest'
    # (capítulo 10 § 3.6).
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      # Lo único que se permite:
      CONTAINERS: 1
      # Todo lo demás, denegado explícitamente:
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Se pide la lista de contenedores, que es exactamente lo que Traefik
      # necesita poder hacer: así la comprobación valida el permiso
      # 'CONTAINERS: 1' y no solo que el intermediario esté vivo.
      #
      # La ruta NO lleva prefijo de versión. Un '/v1.24/' delante hace que el
      # demonio responda 400 Bad Request en cuanto su versión mínima admitida
      # sea superior, cosa que pasa al actualizar Docker: la comprobación
      # empezaría a fallar sola, sin que nada esté roto. Sin prefijo, el
      # demonio usa su versión actual.
      #
      # Tampoco se usa '--spider', que envía HEAD en vez de GET.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2375/containers/json"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  #  Traefik
  # -----------------------------------------------------------------------
  traefik:
    # Se fija la línea menor (v3.7), no 'latest' ni 'v3': así se reciben
    # parches sin sorpresas de una versión mayor (capítulo 10 § 3.6).
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_started

    # ÚNICO puerto publicado de todo el servidor, y atado a una dirección
    # privada: 127.0.0.1 (se llega por túnel SSH) o la IP de Tailscale.
    # NUNCA 0.0.0.0.
    ports:
      - "${TRAEFIK_BIND_INTERNA}:${TRAEFIK_PUERTO_INTERNA}:8080"

    volumes:
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/dinamica:/etc/traefik/dinamica:ro
      # El registro va a la salida estándar del contenedor: así lo recoge
      # Docker (con la rotación del capítulo 09) y lo muestra Dozzle
      # (capítulo 13). No hace falta ningún volumen para logs.

    networks:
      - proxy
      - socket

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      - "traefik.enable=true"

      # Panel de control, solo en el punto de entrada interno.
      # Se puede llegar de dos formas:
      #   · por nombre:  http://${TRAEFIK_DASHBOARD_HOST}:${TRAEFIK_PUERTO_INTERNA}/
      #   · por ruta:    http://<ip-privada>:${TRAEFIK_PUERTO_INTERNA}/dashboard/
      # La segunda funciona sin configurar DNS, que es lo que hace falta la
      # primera vez.
      #
      # LA PRIORIDAD NO ES OPCIONAL. Los dos PathPrefix no están atados a
      # ningún host, así que casan con /dashboard y /api de CUALQUIER nombre
      # que llegue a este punto de entrada. Y Traefik ordena los routers por
      # longitud de regla: esta es larga y ganaría a un simple Host(`…`).
      #
      # Sin esta línea, el panel le roba /api/* a todo lo demás: la interfaz de
      # Dozzle se queda colgada porque sus llamadas acaban en la API de Traefik,
      # y los avisos de Uptime Kuma —que llegan por /api/push/<id>— no llegan
      # nunca, que es como quedarse sin el aviso de que los respaldos han dejado
      # de ejecutarse.
      #
      # Con prioridad 1, este router es el último recurso: cualquier otro que
      # case por nombre de host gana, y el acceso por ruta sigue funcionando
      # para los nombres que no tienen router propio.
      - "traefik.http.routers.panel.priority=1"
      - "traefik.http.routers.panel.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`) || PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
      - "traefik.http.routers.panel.entrypoints=interna"
      - "traefik.http.routers.panel.service=api@internal"
      - "traefik.http.routers.panel.middlewares=solo-privada@file"

networks:
  # Red compartida con los proyectos y con cloudflared. Se crea fuera de este
  # fichero (capítulo 09) y se declara externa para que 'docker compose down'
  # no pueda borrarla.
  proxy:
    external: true
    name: ${DOCKER_RED_PROXY}

  # Red aislada entre el intermediario del socket y quienes lo consultan.
  # Se crea también en el capítulo 09, marcada como 'internal': no tiene
  # salida a internet, así que aunque alguien tomara el intermediario no
  # podría hablar con el exterior.
  # Es externa porque Dozzle (capítulo 13) también se conecta a ella.
  socket:
    external: true
    name: ${DOCKER_RED_SOCKET}
