# ===========================================================================
#  nomad_server — límites de recursos del usuario de la pantalla
#  Destino  : /etc/systemd/system/user-<uid>.slice.d/50-nomad-pantalla.conf
#             donde <uid> es el de ${PANTALLA_USUARIO}: 'id -u ${PANTALLA_USUARIO}'
#  Generado por scripts/18_pantalla.sh
#  Capítulo : docs/18_pantalla_extendida.md § 3.5
#
#  POR QUÉ AQUÍ Y NO EN LA UNIDAD
#
#  'PAMName=login' abre una sesión: el cliente pasa a session-N.scope, dentro de
#  user-<uid>.slice y fuera de nomad-pantalla.service. Lo que limita la unidad ya
#  no lo alcanza. La porción del usuario cubre todas sus sesiones, y ese usuario
#  no hace otra cosa. El HP sigue siendo un servidor: la pantalla no le quita
#  recursos a Docker.
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      destino="/etc/systemd/system/user-$(id -u ${PANTALLA_USUARIO}).slice.d"
#      sudo install -d -m 755 "${destino}"
#      nomad_plantilla systemd/nomad-pantalla-usuario.conf \
#          | sudo tee "${destino}/50-nomad-pantalla.conf" >/dev/null
#
#  Y después, para que tenga efecto:
#      sudo systemctl daemon-reload
# ===========================================================================

[Slice]
CPUWeight=50
MemoryMax=2G
