# ===========================================================================
#  nomad_server — dependencia del disco USB de respaldo
#  Destino  : /etc/systemd/system/nomad-respaldo.service.d/10-disco-usb.conf
#  Generado por scripts/14_restic.sh cuando RESTIC_USB_UUID tiene valor
#  Capítulo : docs/14_respaldos_restic.md § 3.5
#
#  POR QUÉ UN AÑADIDO Y NO UNA LÍNEA EN LA UNIDAD
#
#  'RequiresMountsFor' hace que el servicio espere a que exista el montaje. Es
#  lo correcto cuando hay disco, y una avería silenciosa cuando no lo hay: el
#  respaldo se quedaría esperando para siempre un montaje que nadie va a
#  hacer. Con un añadido, tener o no disco es tener o no este archivo, y
#  scripts/14_restic.sh lo instala o lo retira según RESTIC_USB_UUID.
#
#  CÓMO APLICARLA A MANO (equivalente a lo que hace el script)
#
#      cd ~/nomad_server
#      source scripts/lib/entorno.sh
#      sudo mkdir -p /etc/systemd/system/nomad-respaldo.service.d
#      nomad_plantilla systemd/nomad-respaldo-disco-usb.conf \
#          | sudo tee /etc/systemd/system/nomad-respaldo.service.d/10-disco-usb.conf >/dev/null
#
#  Y después, para que tenga efecto:
#      sudo systemctl daemon-reload
#
#  Detalle: templates/README.md y docs/98_variables_y_entorno.md § 4.3
# ===========================================================================

[Unit]
RequiresMountsFor=${RESTIC_USB_MOUNT}

[Service]
ReadWritePaths=${RESTIC_USB_MOUNT}
